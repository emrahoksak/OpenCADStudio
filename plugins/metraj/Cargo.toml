[package]
name = "opencad-metraj"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ocs_plugin_api = { path = "../../crates/ocs_plugin_api", features = ["host"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rust_xlsxwriter = "0.92"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
